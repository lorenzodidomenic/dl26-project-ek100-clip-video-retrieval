name: dl-project
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg                        # taglio delle clip e lettura dei frame (cut_clips, extract_features, demo)
  - pip:
      - torch==2.14.1             # da pip: CPU/MPS su Mac, CUDA incluso su Linux
      - pytorch-lightning==2.6.6
      - transformers==5.20.2      # TimeSformer e BERT
      - sentence-transformers==6.2.0
      - numpy==2.5.4
      - pandas==3.1.0
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - pillow==13.0.0
      - pyyaml==6.0.3
      - wandb==0.31.0
      - jupyterlab==4.6.5         # notebook in notebooks/

name: Pylint

# solo sulle pull request verso main: il controllo arriva prima del merge
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        # stessa versione di environment.yml
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # pylint fissato: una versione nuova puo' introdurre controlli e far fallire la CI
        pip install pylint==4.1.4 numpy pillow
    - name: Analysing the code with pylint
      # le regole stanno in .pylintrc, letto in automatico dalla root del repo
      run: |
        pylint $(git ls-files '*.py' | grep -v 'epic-kitchens')
